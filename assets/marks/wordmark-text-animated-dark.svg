  <defs>
    <style>
      .top-bar { transform-origin: 256px 180px; animation: bar-expand 4.6s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      .word-main { animation: word-fade 4.6s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      .word-sub { animation: sub-fade 4.6s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      @keyframes bar-expand { 0%, 8% { transform: scaleX(0.2); opacity: 0.3; } 28%, 86% { transform: scaleX(1); opacity: 1; } 96%, 100% { transform: scaleX(0.2); opacity: 0.3; } }
      @keyframes word-fade { 0%, 16% { opacity: 0.25; } 34%, 86% { opacity: 1; } 96%, 100% { opacity: 0.25; } }
      @keyframes sub-fade { 0%, 28% { opacity: 0; } 46%, 86% { opacity: 1; } 96%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .top-bar, .word-main, .word-sub { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    </style>
  </defs>
