<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 256" width="904" height="256" fill="none" role="img" aria-label="Levidev Studio">
  <defs>
    <style>
      .rose-a { animation: rose-float 6s ease-in-out infinite; }
      .rose-b { animation: rose-float 6s ease-in-out 0.2s infinite; }
      .word-main, .word-sub { opacity: 1; }
      .word-main { animation: word-appear 6s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      .word-sub { animation: sub-appear 6s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      .cursor-block { animation: cursor-blink 1.1s steps(2, start) infinite; }
      .row-1 { animation: row-p1 6s ease-in-out infinite; }
      .row-2 { animation: row-p2 6s ease-in-out infinite; }
      .row-3 { animation: row-p3 6s ease-in-out infinite; }
      .row-4 { animation: row-p4 6s ease-in-out infinite; }
      .row-5 { animation: row-p5 6s ease-in-out infinite; }
      @keyframes cursor-blink { 0%, 49% { opacity: 0.9; } 50%, 100% { opacity: 0.15; } }
      @keyframes rose-float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(3px, -5px); } }
      @keyframes word-appear { 0%, 18% { opacity: 1; } 22%, 88% { opacity: 1; } 94%, 100% { opacity: 0.55; } }
      @keyframes sub-appear { 0%, 26% { opacity: 1; } 30%, 88% { opacity: 1; } 94%, 100% { opacity: 0.55; } }
      @keyframes row-p1 { 0%, 10% { opacity: 0.35; } 22%, 88% { opacity: 1; } 96%, 100% { opacity: 0.35; } }
      @keyframes row-p2 { 0%, 18% { opacity: 0.35; } 30%, 88% { opacity: 1; } 96%, 100% { opacity: 0.35; } }
      @keyframes row-p3 { 0%, 26% { opacity: 0.35; } 38%, 88% { opacity: 1; } 96%, 100% { opacity: 0.35; } }
      @keyframes row-p4 { 0%, 34% { opacity: 0.35; } 46%, 88% { opacity: 1; } 96%, 100% { opacity: 0.35; } }
      @keyframes row-p5 { 0%, 42% { opacity: 0.35; } 54%, 88% { opacity: 1; } 96%, 100% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) {
        .rose-a, .rose-b, .word-main, .word-sub, .cursor-block, .row-1, .row-2, .row-3, .row-4, .row-5 {
          animation: none !important; opacity: 1 !important; transform: none !important;
        }
      }
    </style>
  </defs>
